<!-- countdown — cuenta regresiva a la proxima clase en vivo (martes 8pm NY) -->
<div class="cd-panel" id="cdPanel" data-weekday="2" data-hour="20">
  <div class="cd-label">Proxima clase en vivo en</div>
  <div class="cd-units">
    <div class="cd-unit"><span class="cd-num" id="cdDays">00</span><span class="cd-sub">dias</span></div>
    <div class="cd-unit"><span class="cd-num" id="cdHours">00</span><span class="cd-sub">hrs</span></div>
    <div class="cd-unit"><span class="cd-num" id="cdMins">00</span><span class="cd-sub">min</span></div>
    <div class="cd-unit"><span class="cd-num" id="cdSecs">00</span><span class="cd-sub">seg</span></div>
  </div>
</div>
