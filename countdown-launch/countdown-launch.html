<!-- countdown-launch — cuenta regresiva a una fecha FIJA (no semanal como
     countdown/). Pensado para el cierre real de una promocion de lanzamiento.
     Cambia data-target por la fecha/hora real (ISO 8601, con zona horaria). -->
<div class="cdl-panel" id="cdlPanel" data-target="2026-08-01T23:59:59-04:00">
  <div class="cdl-label">Esta promoción cierra en</div>
  <div class="cdl-units">
    <div class="cdl-unit"><span class="cdl-num" id="cdlDays">00</span><span class="cdl-sub">días</span></div>
    <div class="cdl-unit"><span class="cdl-num" id="cdlHours">00</span><span class="cdl-sub">hrs</span></div>
    <div class="cdl-unit"><span class="cdl-num" id="cdlMins">00</span><span class="cdl-sub">min</span></div>
    <div class="cdl-unit"><span class="cdl-num" id="cdlSecs">00</span><span class="cdl-sub">seg</span></div>
  </div>
  <div class="cdl-expired" id="cdlExpired" style="display:none;">Esta promoción ya cerró.</div>
</div>
