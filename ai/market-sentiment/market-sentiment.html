<!-- market-sentiment — indicador de sentimiento GENERAL del mercado,
     ilustrativo. NO es una recomendacion de compra/venta de ningun
     instrumento especifico. -->
<div class="mis-panel">
  <div class="mis-head">
    <span class="mis-label">Market Sentiment</span>
    <span class="mis-tag">Ilustrativo</span>
  </div>
  <div class="mis-gauge">
    <div class="mis-gauge-fill" id="misGaugeFill"></div>
    <div class="mis-gauge-marker" id="misGaugeMarker"></div>
  </div>
  <div class="mis-labels">
    <span>Bajista</span>
    <span id="misStateLabel">Neutral</span>
    <span>Alcista</span>
  </div>
</div>
